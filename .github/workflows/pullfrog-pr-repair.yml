name: Pullfrog PR repair

# On every same-repo pull request update, hand the pull request to the Pullfrog agent so it can fix
# lint/format errors or rewrite a non-conventional title. Bot-authored PRs (Mintlify) are the main target:
# Pullfrog's built-in "Fix CI failures" skips bot commits.
#
# This uses `pull_request` (not `workflow_run`) on purpose: Pullfrog only lets `push_branch` push to a PR
# when the run is scoped to that PR, and a `workflow_run` event is never scoped to one.

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - edited
            - ready_for_review

permissions: {}

# One repair at a time per pull request; never cancel an agent run mid-flight.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: false

env:
    # Stop retrying a branch after this many runs in 24 hours so a failure the agent cannot fix does not loop.
    MAX_RUNS_PER_BRANCH: 6

jobs:
    resolve:
        name: 🔎 Resolve pull request
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # Same-repo, non-draft pull requests only: fork code never reaches a job that holds secrets.
        # An `edited` event only counts when the title changed, not the body (Mintlify rewrites it often).
        if: >-
            github.repository == 'wolfstar-project/stars-components-docs' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.draft == false &&
            (github.event.action != 'edited' || github.event.changes.title != null)
        permissions:
            actions: read
        outputs:
            repair: ${{ steps.resolve.outputs.repair }}
        steps:
            - name: Check the repair budget
              id: resolve
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail

                  since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
                  runs=$(gh api "repos/$REPO/actions/workflows/pullfrog-pr-repair.yml/runs?branch=$BRANCH&created=%3E%3D$since&per_page=100" \
                      --jq '[.workflow_runs[] | select(.conclusion != "skipped")] | length')

                  if [ "$runs" -gt "$MAX_RUNS_PER_BRANCH" ]; then
                      echo "repair=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Skipping repair: $runs runs in 24h on $BRANCH, a human needs to look"
                      exit 0
                  fi
                  echo "repair=true" >> "$GITHUB_OUTPUT"

    repair:
        name: 🐸 Pullfrog repair
        needs: resolve
        if: needs.resolve.outputs.repair == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            id-token: write # OIDC token exchanged by pullfrog/pullfrog for a scoped GitHub App token
            contents: write # lets the agent push its fix to the pull request head branch
            pull-requests: write # lets the agent comment on the pull request and rewrite its title
        steps:
            # Check out the default branch, not the pull request merge ref, so the prompt template
            # below can never be edited by the pull request it is run against.
            - name: Checkout Project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Render prompt
              env:
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              # The template is rendered inside .git so the agent never commits it.
              # `PR` is a number and `REPO` is a fixed repository name, so neither can inject into sed.
              run: |
                  sed -e "s|{{PR}}|$PR|g" \
                      -e "s|{{REPO}}|$REPO|g" \
                      .github/pullfrog/pr-repair.md > .git/pullfrog-prompt.md

            - name: Run agent
              uses: pullfrog/pullfrog@cb3bda7d56a8728500c37e1eda718271e7ec4616 # v0.1.121
              with:
                  timeout: 20m
                  push: restricted
                  shell: restricted
                  prompt_file: .git/pullfrog-prompt.md
              env:
                  # add at least one provider API key (or configure one in the Pullfrog console)
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
