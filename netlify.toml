[build]
command = "pnpm build"
publish = ".vitepress/dist"

[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "11.9.0"

[[redirects]]
from = "/guide/getting-started"
to = "/guide/"
status = 301

[[redirects]]
from = "/guide/migrating-to-plugin-i18next"
to = "/guide/migration"
status = 301

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
Referrer-Policy = "strict-origin-when-cross-origin"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
